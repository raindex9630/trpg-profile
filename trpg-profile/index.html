<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>黒澤のプロフィール</title>
    <link rel="stylesheet" href="style.css?v=20260701a">
    <!-- Google Fonts: Noto Sans JP for readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <nav>
            <ul>
                <li><a href="#profile" class="nav-link" data-target="profile">プロフィール</a></li>
                <li><a href="#likes" class="nav-link" data-target="likes">地雷/好物</a></li>
                <li><a href="#scenarios" class="nav-link" data-target="scenarios">シナリオ</a></li>
                <li><a href="#pcs" class="nav-link" data-target="pcs">探索者</a></li>
                <li><a href="#works" class="nav-link" data-target="works">自作シナリオ</a></li>
            </ul>
        </nav>
    </header>

    <main id="app">
        <!-- コンテンツがここに動的にロードされます -->
        <div id="loading">Loading...</div>
    </main>

    <!-- 画像拡大用モーダル -->
    <div id="image-modal" class="modal hidden">
        <button id="modal-prev" class="modal-nav modal-prev" aria-label="前へ">&#10094;</button>
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modal-img" src="" alt="Expanded Image">
            <p id="modal-caption"></p>
            <div id="modal-counter" class="modal-counter"></div>
        </div>
        <button id="modal-next" class="modal-nav modal-next" aria-label="次へ">&#10095;</button>
    </div>

    <!-- ネタバレ確認ダイアログ -->
    <div id="spoiler-dialog">
        <div id="spoiler-dialog-overlay"></div>
        <div class="spoiler-dialog-box">
            <div class="spoiler-dialog-icon">⚠</div>
            <div class="spoiler-dialog-title">ネタバレが含まれます</div>
            <div class="spoiler-dialog-body">このイラストにはシナリオのネタバレが含まれます。<br>表示してもよろしいですか？</div>
            <div class="spoiler-dialog-buttons">
                <button id="spoiler-confirm-yes">表示する</button>
                <button id="spoiler-confirm-no">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="app_v2.js?v=20260701a"></script>
</body>

</html>
