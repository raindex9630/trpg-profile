<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8fafc">
  <title>卓予定カレンダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <div class="app-shell">
    <div id="status" class="status" role="status" aria-live="polite">GitHubからカレンダーを読み込んでいます…</div>

    <main id="workspace" class="editor-workspace" hidden>
      <aside id="edit-panel" class="edit-panel" aria-labelledby="panel-title" hidden>
        <header class="panel-header">
          <div>
            <p class="panel-kicker">SESSION</p>
            <h1 id="panel-title">セッション追加</h1>
          </div>
          <button id="panel-close-button" class="panel-close-button" type="button" aria-label="編集パネルを閉じる">×</button>
        </header>

        <form id="session-editor-form" class="panel-body" autocomplete="off">
          <section id="session-fields" class="panel-section">
            <label class="field-label" for="scenario-name">シナリオ名</label>
            <input id="scenario-name" type="text" maxlength="160">

            <label class="field-label" for="session-round">陣</label>
            <input id="session-round" type="text" maxlength="60" placeholder="例：1陣">

            <fieldset class="category-fieldset">
              <legend>区分</legend>
              <div class="category-options">
                <label class="category-option tag-gm"><input type="radio" name="session-tag" value="GM"> GM</label>
                <label class="category-option tag-pl"><input type="radio" name="session-tag" value="PL"> PL</label>
                <label class="category-option tag-hold"><input type="radio" name="session-tag" value="仮押さえ"> 仮押さえ</label>
                <label class="category-option tag-blocked"><input type="radio" name="session-tag" value="×"> 予定アリ</label>
              </div>
            </fieldset>
          </section>

          <section class="panel-section schedule-editor-section">
            <div class="panel-section-heading">
              <h2>日程</h2>
              <span id="occurrence-count" class="count-badge">0件</span>
            </div>
            <p id="selection-guide" class="selection-guide">カレンダー上の日付をクリックして追加</p>
            <button id="add-dates-mode-button" class="secondary-button full-button" type="button" hidden>＋ このセッションに日程を追加</button>

            <div id="bulk-time-panel" class="bulk-panel">
              <p class="bulk-title">一括時刻</p>
              <div class="bulk-time-row">
                <input id="bulk-start-time" type="text" inputmode="numeric" value="21:00" aria-label="一括開始時刻">
                <span>～</span>
                <input id="bulk-end-time" type="text" inputmode="numeric" value="24:00" aria-label="一括終了時刻">
              </div>
              <button id="apply-bulk-time-button" class="secondary-button full-button" type="button">全日程に適用</button>
            </div>

            <div id="bulk-period-panel" class="bulk-panel" hidden>
              <label class="field-label" for="bulk-period">一括区分</label>
              <select id="bulk-period">
                <option value="all_day">終日</option>
                <option value="day">昼</option>
                <option value="night">夜</option>
              </select>
              <button id="apply-bulk-period-button" class="secondary-button full-button" type="button">全日程に適用</button>
            </div>

            <div id="occurrence-list" class="occurrence-list"></div>
            <p id="empty-occurrences" class="empty-occurrences">日付が選択されていません。</p>
          </section>
        </form>

        <footer class="panel-footer">
          <button id="delete-session-button" class="danger-button" type="button" hidden>セッション削除</button>
          <div class="panel-footer-actions">
            <button id="panel-cancel-button" class="quiet-button" type="button">キャンセル</button>
            <button id="panel-save-button" class="primary-button" type="submit" form="session-editor-form">登録</button>
          </div>
        </footer>
      </aside>

      <section class="calendar-shell" aria-labelledby="month-label">
        <div class="calendar-toolbar">
          <button id="month-prev" class="month-button" type="button" aria-label="前の月を表示">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
          </button>

          <div class="month-heading" aria-live="polite">
            <div class="month-heading-line">
              <h2 id="month-label">読み込み中</h2>
              <div class="month-actions">
                <button id="month-today" class="toolbar-button" type="button">今月を表示</button>
                <button id="month-jump" class="toolbar-button" type="button">指定月にジャンプ</button>
                <button id="copy-public-url" class="toolbar-button copy-url-button" type="button">共有URLをコピー</button>
              </div>
            </div>
            <div class="legend" aria-label="予定種別の色分け">
              <span class="legend-item tag-gm">GM</span>
              <span class="legend-item tag-pl">PL</span>
              <span class="legend-item tag-hold">仮押さえ</span>
              <span class="legend-item tag-blocked">予定アリ</span>
            </div>
          </div>

          <button id="month-next" class="month-button" type="button" aria-label="次の月を表示">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </button>

          <p id="calendar-updated" class="calendar-updated"></p>
          <div class="editor-toolbar-tools">
            <button id="new-session-button" class="toolbar-button add-session-button" type="button">＋ セッション追加</button>
            <div class="owner-controls">
              <span id="dirty-indicator" class="state-pill">読込中</span>
              <details class="owner-menu">
                <summary>管理</summary>
                <div class="owner-menu-panel">
                  <button id="undo-button" type="button" disabled>元に戻す</button>
                  <button id="redo-button" type="button" disabled>やり直す</button>
                  <button id="download-button" type="button" disabled>編集中JSONを退避</button>
                  <button id="reload-button" type="button">最新版を再読込</button>
                  <button id="page-settings-button" type="button">ページ名・説明</button>
                  <button id="save-button" class="menu-save-button" type="button" disabled>GitHubへ保存</button>
                </div>
              </details>
            </div>
          </div>
        </div>

        <section id="conflict-panel" class="conflict-panel" aria-labelledby="conflict-title" hidden>
          <div>
            <h2 id="conflict-title">保存の競合を検出しました</h2>
            <p>編集中の内容を保持しています。JSONを退避して最新版を確認してください。</p>
          </div>
          <div class="conflict-actions">
            <button id="conflict-download-button" class="secondary-button" type="button">編集中JSONを退避</button>
            <button id="conflict-reload-button" class="danger-button" type="button">最新版を再読込</button>
          </div>
        </section>

        <div class="calendar-viewport" aria-label="月間予定カレンダー">
          <div class="weekdays" aria-hidden="true">
            <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="saturday">土</span><span class="holiday">日</span>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-labelledby="month-label"></div>
        </div>

        <section id="monthly-note" class="monthly-note" aria-labelledby="monthly-note-title">
          <div class="monthly-note-heading">
            <h2 id="monthly-note-title"></h2>
            <button id="edit-month-note-button" class="note-edit-button" type="button">月メモを編集</button>
          </div>
          <p id="monthly-note-text" tabindex="-1"></p>
        </section>
      </section>
    </main>

    <dialog id="month-jump-dialog" class="editor-dialog" aria-labelledby="month-jump-title">
      <form method="dialog" class="dialog-form">
        <div class="dialog-heading">
          <h2 id="month-jump-title">表示する年月</h2>
          <button class="dialog-close" type="submit" value="cancel" aria-label="閉じる">×</button>
        </div>
        <label class="field-label" for="month-jump-input">年月</label>
        <input id="month-jump-input" type="month" min="2000-01" max="2099-12">
        <p class="dialog-note">年月を選択すると、その月へ移動します。</p>
      </form>
    </dialog>

    <dialog id="month-note-dialog" class="editor-dialog" aria-labelledby="month-note-dialog-title">
      <form id="month-note-form" class="dialog-form">
        <div class="dialog-heading">
          <h2 id="month-note-dialog-title">月メモを編集</h2>
          <button id="month-note-close-button" class="dialog-close" type="button" aria-label="閉じる">×</button>
        </div>
        <label id="month-note-label" class="field-label" for="month-note"></label>
        <textarea id="month-note" rows="6" maxlength="4000"></textarea>
        <div class="dialog-actions">
          <button id="month-note-cancel-button" class="quiet-button" type="button">キャンセル</button>
          <button class="primary-button" type="submit">月メモを保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="page-settings-dialog" class="editor-dialog" aria-labelledby="page-settings-title">
      <form id="settings-form" class="dialog-form">
        <div class="dialog-heading">
          <h2 id="page-settings-title">ページ名・説明</h2>
          <button id="page-settings-close-button" class="dialog-close" type="button" aria-label="閉じる">×</button>
        </div>
        <label class="field-label" for="calendar-name">ページ名</label>
        <input id="calendar-name" type="text" maxlength="160">
        <label class="field-label" for="calendar-description">説明</label>
        <textarea id="calendar-description" rows="4" maxlength="1000"></textarea>
        <div class="dialog-actions">
          <button id="page-settings-cancel-button" class="quiet-button" type="button">キャンセル</button>
          <button class="primary-button" type="submit">ページ設定を保存</button>
        </div>
      </form>
    </dialog>
  </div>

  <script type="module" src="./editor.js"></script>
</body>
</html>
